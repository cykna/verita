[package]
name = "verita"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]
members = [".", "database", "migration"]

[workspace.dependencies]
color-eyre = "0.6.5"
flume = "0.12.0"
sea-orm = {version = "2.0.2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"]}
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
chrono = "0.4.45"

[dependencies]
database = {path="database"}
migration = {path="migration"}
color-eyre.workspace=true
flume.workspace=true
sea-orm.workspace=true
tokio.workspace=true
tracing.workspace=true
chrono.workspace=true

libp2p = {version="0.56.0", features = ["tokio","gossipsub", "mdns", "noise", "macros", "tcp", "yamux", "quic", "kad"]}
slint = "1.17.1"
tracing-subscriber = "0.3.23"

[build-dependencies]
slint-build = "1.16.0"
