[package]
name = "verita"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]
members = [".", "migration"]

[dependencies]
migration = {path="migration"}
color-eyre = "0.6.5"
flume = "0.12.0"
libp2p = {version="0.56.0", features = ["tokio","gossipsub", "mdns", "noise", "macros", "tcp", "yamux", "quic"]}
sea-orm = {version = "2.0.2", features = ["sqlx-sqlite", "runtime-tokio", "macros"]}
slint = "1.17.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = "0.3.23"
tracing = "0.1.44"

[build-dependencies]
slint-build = "1.16.0"
